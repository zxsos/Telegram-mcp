name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: telegram-mcp-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: telegram-mcp-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: telegram-mcp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/telegram-mcp*
            !target/${{ matrix.target }}/release/*.d

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename binaries
        run: |
          mv dist/telegram-mcp-linux-x86_64/telegram-mcp dist/telegram-mcp-linux-x86_64-bin
          mv dist/telegram-mcp-macos-arm64/telegram-mcp dist/telegram-mcp-macos-arm64-bin
          mv dist/telegram-mcp-windows-x86_64.exe/telegram-mcp.exe dist/telegram-mcp-windows-x86_64.exe-bin
          ls -R dist
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            dist/telegram-mcp-linux-x86_64-bin#telegram-mcp-linux-x86_64 \
            dist/telegram-mcp-macos-arm64-bin#telegram-mcp-macos-arm64 \
            "dist/telegram-mcp-windows-x86_64.exe-bin#telegram-mcp-windows-x86_64.exe"
