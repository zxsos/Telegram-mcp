name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: telegram-mcp-linux-x86_64
          # Linux x86_64 (musl static, for Alpine)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: telegram-mcp-linux-x86_64-musl
          # Linux aarch64 (ARM64 servers)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: telegram-mcp-linux-aarch64
          # macOS ARM64 (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: telegram-mcp-macos-arm64
          # macOS x86_64 (Intel)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: telegram-mcp-macos-x86_64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: telegram-mcp-windows-x86_64.exe
          # Windows ARM64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: telegram-mcp-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/telegram-mcp*
            !target/${{ matrix.target }}/release/*.d

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename binaries
        run: |
          for d in dist/*/; do
            name=$(basename "$d")
            # Find the binary in the subdirectory
            bin=$(find "$d" -maxdepth 1 -name "telegram-mcp*" -type f | head -1)
            if [ -n "$bin" ]; then
              mv "$bin" "dist/${name}-bin"
            fi
          done
          ls -lh dist/
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            dist/telegram-mcp-linux-x86_64-bin#telegram-mcp-linux-x86_64 \
            dist/telegram-mcp-linux-x86_64-musl-bin#telegram-mcp-linux-x86_64-musl \
            dist/telegram-mcp-linux-aarch64-bin#telegram-mcp-linux-aarch64 \
            dist/telegram-mcp-macos-arm64-bin#telegram-mcp-macos-arm64 \
            dist/telegram-mcp-macos-x86_64-bin#telegram-mcp-macos-x86_64 \
            "dist/telegram-mcp-windows-x86_64.exe-bin#telegram-mcp-windows-x86_64.exe" \
            "dist/telegram-mcp-windows-arm64.exe-bin#telegram-mcp-windows-arm64.exe"
